model:
  provider: openrouter
  default: "@preset/trc-staging"

# ── Tool surface (H1) ─────────────────────────────────────────────────
# WITHOUT this key the API server resolves the default `hermes-api-server`
# toolset: terminal, process, read_file, write_file, patch, search_files,
# web_search, web_extract, twelve browser_*, execute_code, delegate_task,
# cronjob, skill_manage, image_generate, vision_analyze — about thirty tools
# on the wire beside the five `mcp__ragnarok__*` ones. The system prompt bans
# them by instruction only, and the model ran `search_files` anyway.
#
# `ragnarok` is the MCP server name; `resolve_toolset` resolves an MCP server
# name as a toolset (toolsets.py, `get_toolset_alias_target`). If a deployed
# build returns None for it, the fallback is `disabled_toolsets` listing every
# non-MCP toolset — verify with `hermes tools --platform api_server`, which
# must list the `mcp__ragnarok__*` tools in `tools.include` below, `execute_code`,
# `skills_list` and `skill_view` — and never `skill_manage`.
#
# `skills_readonly` (2026-10-05): the TRC playbooks in deploy/trc/skills, mounted
# read-only over $HERMES_HOME/skills so they are the ONLY skills indexed. Read, never
# written: a model-written skill would be an unreviewed prompt in every later session,
# outside the redaction boundary's retention sweep — the reason memory is off below.
platform_toolsets:
  api_server:
    - ragnarok
    - code_execution
    - skills_readonly

# ── Analysis sandbox (trc-backend spec 2026-09-28-hermes-analysis-sandbox-design) ──
# execute_code runs scripts in the `hermes-sandbox` container (no network, no files,
# no secrets) and never in this process. Scripts reach data ONLY through the four
# tools below, via the gateway's bridge, with this request's verified identity.
# Kill switch: remove `code_execution` from platform_toolsets.api_server.
code_execution:
  transport: sidecar
  sidecar_socket: /run/hermes-sandbox/sock
  sidecar_limits: {wall: 240, cpu: 60, mem_mb: 768}
  timeout: 270
  max_tool_calls: 20
  sandbox_tools:
    - mcp__ragnarok__query
    # A value series over many periods for ONE entity, in one call instead of a query
    # per period (trc-backend spec 2026-10-01).
    - mcp__ragnarok__period_series
    - mcp__ragnarok__read_document
    - mcp__ragnarok__list_entities
    - mcp__ragnarok__find_relationships
    # A script publishes a computed report with report.publish() (trc-backend spec §7).
    - mcp__ragnarok__render_report
  # Gateway-only backend tool fed each run's output, for the "calculated" figure note.
  # Deliberately NOT in mcp_servers.ragnarok.tools.include: the model must not call it.
  record_computed_server: ragnarok
  description_intro: >-
    Use this, without being asked, whenever an answer COMBINES figures: a change over
    time, a trend, a comparison across entities or periods, a total, average, share,
    ranking or count. A change over a span is a path, not one period: for ONE entity
    call period_series once to get its whole monthly or quarterly series. Run a short
    Python program for the calculation over TRC data. It runs
    in an isolated sandbox with no network and no files; its only data source is the
    ragnarok tools listed below, called with keyword arguments. Fetch inside the
    program when you need many rows, pass answer=False to query when you need only
    the data, and print only results — each figure with its [Sn] marker and date.
    numpy and pandas are available.

# ── Subagents (trc-orchestrator spec 2026-10-13 §5, Phase C) ──────────
# delegate_task, for multi-section research and reports only (SOUL.md says when).
# Enabled by `delegation` in platform_toolsets.api_server above.
# Kill switch: remove it from there.
delegation:
  # Foreground only. The API server cannot hand a detached result back to the
  # user's request: background would end the turn and answer later through a
  # wake self-POST, a new turn outside the request that carried the identity.
  background: false
  # Nothing on disk outside the session DB (invariant I5): no live transcripts
  # under cache/delegation/live, no summary spill files, no timeout diagnostic
  # in logs/. Child sessions are in the session DB with parent_session_id.
  live_log: false
  spill_summaries: false
  max_concurrent_children: 3
  max_spawn_depth: 1
  max_iterations: 6
  # Above the 160 s MCP timeout below, so a child's one slow query returns, or
  # times out with a structured result, before the child itself is cut off.
  child_timeout_seconds: 170
  # model / provider deliberately unset: children inherit the route's model and
  # its provider filters, the data-retention decision in "Served model" below.
  result_instructions: >-
    Your reply goes to the assistant that gave you this task, not to the user.
    Return your findings, not an account of what you did. Give every figure
    with its unit, its date or period, and its [Sn] marker, exactly as the tool
    returned them. Copy every placeholder in angle brackets and every [Sn]
    marker character for character: never rename, renumber, merge, split or
    drop one, and never replace one with a description. Never summarise a
    figure away: every figure that bears on the task appears in your reply.
    Say plainly what you looked for and did not find.

# ── Loop guardrails (H4) ──────────────────────────────────────────────
# `hard_stop_enabled` ships false and `max_turns` ships 90: a model looping on
# a failing tool could spend ninety turns of external inference before anyone
# noticed. Twelve turns is enough for query → read_document ×3 → answer.
agent:
  max_turns: 12
  # ── System prompt size (H2) ─────────────────────────────────────────
  # Message 0 was 27,541 characters on staging and the TRC rules started
  # after the first 15 K of it. These two blocks are Hermes' own generic
  # guidance ("finish the job", "batch your tool calls"); with five MCP
  # tools and a prompt that already states the routing rules, they add
  # length in front of the rules that matter and nothing else.
  task_completion_guidance: false
  parallel_tool_call_guidance: false
  # "You run on Hermes Agent (by Nous Research) … docs at <url>": names the framework
  # and points at a skill this deployment does not carry, against SOUL.md's rule
  # that the assistant never describes how it works.
  hermes_help_guidance: false
tool_loop_guardrails:
  hard_stop_enabled: true
  hard_stop_after:
    exact_failure: 3
    same_tool_failure: 4
    idempotent_no_progress: 3
dashboard:
  theme: mono
  font: system-sans
# Persistent memory OFF. These are the keys Hermes reads (agent/agent_init.py).
# This block said `enabled: false` / `session_search: false` until 2026-09-23 —
# neither is a key Hermes reads, so the defaults (both True) won and a "USER
# PROFILE" built from earlier chats sat in every system prompt on staging,
# persisted on the volume with no retention. In this deployment memory is a PII
# store outside the redaction boundary's retention sweep, not a preference.
# tests/test_trc_config_memory_off.py checks the MERGED config.
memory:
  memory_enabled: false
  user_profile_enabled: false
skills:
  disabled:
    - codebase-inspection
    - github-auth
    - github-code-review
    - github-issues
    - github-pr-workflow
    - github-repo-management
    - openhue
    - spike
    - systematic-debugging
    - test-driven-development
    - xurl
approvals:
  mode: false
security:
  tirith_enabled: false
_config_version: 33
session:
  persist: true
# ── Served model (H6) ─────────────────────────────────────────────────
# `model.default` said minimax/minimax-m3 and every Hermes-tagged OpenRouter
# row for the staging session was deepseek/deepseek-v4-pro. Two candidate
# causes: dashboard-persisted config on the volume winning over the uploaded
# file, and Open WebUI sending a `model` field Hermes accepts as a raw
# per-session model.
#
# The alias closes the second: Open WebUI selects `trc-assistant` (O4), which
# resolves HERE to the model we chose, so the served model is a config value
# and not whatever the client typed. `direct_model_requests` stays off (the
# default) so a bare model name from any other client cannot switch the
# executing model either.
#
# Whichever model is named here is a data-retention decision as much as a
# quality one — it and the backend's generation model see masked text, and
# both belong in the runbook with their providers' terms.
#
# The route (and `model.default`, which the status-hint side calls fall back
# to) points at an OpenRouter preset, so the model, providers and sampling are
# chosen in the OpenRouter dashboard without a redeploy. The dashboard's
# "default model" setting does NOT change this — the alias wins over
# `model.default` for every Open WebUI turn. The preset is not in OpenRouter's
# model catalogue, so Hermes assumes a 256K context and steps down on overflow.
platforms:
  api_server:
    extra:
      model_routes:
        trc-assistant:
          model: "@preset/trc-staging"
          provider: "openrouter"

mcp_servers:
  ragnarok:
    url: http://app:8000/mcp
    forward_user_identity: true
    # H5. The default is 300 s and the backend now gives up at 150 s
    # (`QUERY_DEADLINE_SECONDS`), so this sits just above it: the backend is
    # always the side that gives up first, and it gives up with a structured
    # `timeout` naming the stages that finished. At 300 s a user waited five
    # minutes on a turn whose generation had finished after 52 s.
    #
    # No automatic retry here on purpose — the model's own "let me try once
    # more" is acceptable; a second 150 s wait added by the client doubles the
    # damage without asking anyone.
    timeout: 160
    # Independent calls in one turn (one `query` per entity or period) run at
    # once instead of queueing on one lock. The caps match the backend's query
    # limiter (QUERY_MAX_CONCURRENT=6, QUERY_MAX_CONCURRENT_PER_USER=3), so a
    # fourth same-user call waits here for a slot rather than being refused with
    # `busy`. Each call carries its own end user's identity (per-call
    # correlation, tools/mcp_tool.py). Rollback: `max_concurrent_calls: 1`, or
    # `supports_parallel_tool_calls: false`.
    supports_parallel_tool_calls: true
    max_concurrent_calls: 6
    max_concurrent_calls_per_user: 3
    # H1 follow-up: `tools/mcp_tool.py` honours `tools.include`/`exclude` per
    # MCP server. Pin the six end-user tools so `ingest_document` is off the
    # wire by construction. A NEW backend tool must be added here to reach the
    # model — the allowlist is the gate, not the prompt ban.
    tools:
      include:
        - query
        - period_series
        - read_document
        - list_entities
        - generate_report
        - render_report
        - find_relationships
        - list_interactions
        - lookup_live

# ── Security ──────────────────────────────────────────────────────────
# Secret redaction is ON by default — strings that look like API keys,
# tokens, and passwords are masked in tool output, logs, and chat
# responses before the model or user ever sees them. Set redact_secrets
# to false to disable (e.g. when developing the redactor itself).
# tirith pre-exec scanning is enabled by default when the tirith binary
# is available. Configure via security.tirith_* keys or env vars
# (TIRITH_ENABLED, TIRITH_BIN, TIRITH_TIMEOUT, TIRITH_FAIL_OPEN).
#
# security:
#   redact_secrets: true
#   tirith_enabled: true
#   tirith_path: "tirith"
#   tirith_timeout: 5
#   tirith_fail_open: true

# ── Fallback Model ────────────────────────────────────────────────────
# Automatic provider failover when primary is unavailable.
# Uncomment and configure to enable. Triggers on rate limits (429),
# overload (529), service errors (503), or connection failures.
#
# Supported providers:
#   openrouter   (OPENROUTER_API_KEY)  — routes to any model
#   openai-codex (OAuth — hermes auth) — OpenAI Codex
#   nous         (OAuth — hermes auth) — Nous Portal
#   zai          (ZAI_API_KEY)         — Z.AI / GLM
#   kimi-coding  (KIMI_API_KEY)        — Kimi / Moonshot
#   kimi-coding-cn (KIMI_CN_API_KEY)   — Kimi / Moonshot (China)
#   minimax      (MINIMAX_API_KEY)     — MiniMax
#   minimax-cn   (MINIMAX_CN_API_KEY)  — MiniMax (China)
#   bedrock      (AWS IAM / boto3)     — AWS Bedrock (Converse API)
#
# For custom OpenAI-compatible endpoints, add base_url and key_env.
#
# fallback_model:
#   provider: openrouter
#   model: anthropic/claude-sonnet-4

auxiliary:
  # Interim status line above the answer in Open WebUI (trc-backend spec
  # 2026-09-16-interim-status-while-answering-design.md). The side-call sees only the
  # masked question; choose a model whose retention terms match the reasoning model's.
  status_hints:
    enabled: true
    provider: "auto"
    model: ""
    reasoning_effort: "none"
    timeout: 5
    max_lines: 4
    cadence_seconds: 6
