# TRC staging deploy for hermes-agent. Additive and TRC-only -- no upstream
# tooling reads this file. See docs/deploy/trc-staging.md.
#
# This is one of three independent compose projects that together reproduce the
# topology the retired trc-docker-paperclip-hermes repo used to own in a single
# file. Contract checks live in deploy/trc/validate_compose.py; read its
# docstring before changing `external: true` or any container_name here.
name: trc-staging-hermes-agent

networks:
  # Both bridges are external: they are shared with other compose projects, so
  # none of those projects can own their creation. `poc-net` is created once on
  # the host; `trc-shared` belongs to whoever runs the trc-backend stack.
  poc-net:
    external: true
  trc-shared:
    external: true

volumes:
  # Hermes state: sessions, logs, memories, cron, workspace. External so that a
  # rename of this compose project can never silently swap in an empty volume.
  trc-staging-hermes-memory:
    external: true
  # Holds only the runner's unix socket (trc-backend spec 2026-09-28 §5.1). No data,
  # so -- alone among this file's volumes -- it is project-owned, not external.
  hermes-sandbox-sock: {}

services:
  hermes-agent:
    image: ${HERMES_IMAGE:?HERMES_IMAGE must be set}
    # The deploy builds this image directly into THIS host's image store and
    # pushes it nowhere -- see .github/workflows/trc-staging-deploy.yml. So a
    # missing image is a broken deploy, and must fail closed and say so.
    #
    # Without this, Compose's default (`missing`) would reach out to the
    # registry named in the tag. That either fails confusingly, or -- for a
    # commit that was deployed under the older push-based scheme -- SUCCEEDS
    # against a stale image still sitting in GHCR and silently starts code
    # that is not what this run built.
    pull_policy: never
    # Load-bearing: open-webui reaches this service at
    # http://hermes-agent:8642 from a *different* compose project, which
    # resolves by container name over poc-net. Renaming this breaks chat with
    # no error in this file.
    container_name: hermes-agent
    command: gateway run
    networks: [poc-net, trc-shared]
    restart: unless-stopped
    ports:
      # Two variables on purpose, one per publisher. The gateway and the
      # dashboard have different exposure needs, and a single HERMES_BIND could
      # not express that: the differing DEFAULTS made it look like it could, but
      # the moment a value was set it applied to BOTH lines -- so publishing the
      # dashboard to the LAN silently published the LLM gateway with it.
      #
      # 8642 is the OpenAI-compatible gateway. open-webui reaches it over
      # poc-net by container name, which does not go through a published port at
      # all, so publishing it past loopback buys nothing and exposes a
      # bearer-token endpoint to the network.
      - "${HERMES_API_BIND:-127.0.0.1}:8642:8642"
      # 9119 is the operator dashboard, gated by HTTP basic auth. Published
      # wider in staging so operators reach it without an SSH tunnel. Both
      # defaults are loopback deliberately: an unset variable must fail closed,
      # never publish to every interface.
      - "${HERMES_DASHBOARD_BIND:-127.0.0.1}:9119:9119"
    environment:
      OPENROUTER_API_KEY: "${OPENROUTER_API_KEY}"
      HERMES_YOLO_MODE: "true"
      API_SERVER_ENABLED: "true"
      API_SERVER_HOST: "0.0.0.0"
      API_SERVER_PORT: "8642"
      # Must be >=16 chars. The gateway refuses to start the API server below
      # that, so a short key surfaces as connection-refused on :8642 rather
      # than a 401. The deploy workflow asserts the length before deploying.
      API_SERVER_KEY: "${HERMES_API_KEY:?HERMES_API_KEY must be set}"
      HERMES_DASHBOARD: "1"
      HERMES_DASHBOARD_HOST: "0.0.0.0"
      HERMES_DASHBOARD_BASIC_AUTH_USERNAME: "${HERMES_DASHBOARD_BASIC_AUTH_USERNAME}"
      HERMES_DASHBOARD_BASIC_AUTH_PASSWORD: "${HERMES_DASHBOARD_BASIC_AUTH_PASSWORD}"
      HERMES_SKIP_CONFIG_MIGRATION: "1"
      # Wins over config.yaml and refuses any unknown value, so an unreadable or
      # half-written config can never make model-written code run as a local
      # subprocess here, where the network and Hermes' volumes are.
      HERMES_CODE_EXECUTION_TRANSPORT: sidecar
    depends_on: [hermes-sandbox]
    volumes:
      - trc-staging-hermes-memory:/opt/data
      # The analysis sandbox runner's socket (deploy/trc/sandbox/runner.py).
      - hermes-sandbox-sock:/run/hermes-sandbox
      # Absolute path ON THE SERVER. Bind-mount sources are resolved by the
      # remote daemon, so a relative path here would point at a directory that
      # exists only on the CI runner. The deploy scp's this file into place.
      - ${HERMES_CONFIG_PATH:?HERMES_CONFIG_PATH must be set}:/opt/data/config.yaml
      # The TRC system prompt, as the IDENTITY tier (see deploy/trc/README-SOUL.md).
      # Read-only: nothing in the container should rewrite the security rules. It must
      # be a bind mount, not a file dropped into the volume — the image seeds its own
      # default SOUL.md into /opt/data on first boot and never overwrites it, so only
      # a mount wins over that copy. Until 2026-09-23 the deploy uploaded this file to
      # the host and nothing mounted it, and the model ran with no TRC rules at all.
      - ${HERMES_SOUL_PATH:?HERMES_SOUL_PATH must be set}:/opt/data/SOUL.md:ro

  hermes-sandbox:
    # The analysis sandbox runner (deploy/trc/sandbox). Runs model-written Python, so
    # everything below is the security boundary -- validate_compose.py asserts each line.
    image: ${HERMES_SANDBOX_IMAGE:?HERMES_SANDBOX_IMAGE must be set}
    pull_policy: never
    container_name: hermes-sandbox
    restart: unless-stopped
    # A real PID 1 that reaps orphans: without it the runner is PID 1, a killed
    # setsid/double-fork leftover stays a zombie under the slot uid, and SIGTERM on
    # `docker stop` is not delivered properly.
    init: true
    network_mode: none
    read_only: true
    cap_drop: [ALL]
    cap_add: [SETUID, SETGID, KILL, CHOWN, DAC_OVERRIDE, FOWNER]
    security_opt: ["no-new-privileges:true"]
    ipc: none            # private IPC namespace, no /dev/shm mounted
    sysctls:
      kernel.shm_rmid_forced: 1     # SysV shm dies with its last process
      kernel.msgmni: 0              # no SysV message queues
      kernel.sem: "0 0 0 0"         # no SysV semaphore sets
      fs.mqueue.queues_max: 0       # no POSIX message queues
    # Three slots of 768 MB plus the daemon. Size against the host's free memory
    # after Milvus before enabling (spec §12); the host has swap-killed the app once.
    # rlimits are per process, so mem_limit is the real bound on the total; the
    # launcher sets oom_score_adj=1000 on every run, so the OOM killer takes a run
    # before the daemon.
    mem_limit: 3g
    pids_limit: 128
    cpus: 2
    tmpfs:
      # One size- and inode-capped tmpfs per slot; /work itself stays on the read-only
      # root. nr_inodes keeps a run's entry count inside the runner's cleanup cap, and
      # noexec stops a run writing and loading a native payload.
      - /work/slot-20001:size=256m,nr_inodes=4096,uid=20001,gid=20001,mode=0700,noexec,nosuid,nodev
      - /work/slot-20002:size=256m,nr_inodes=4096,uid=20002,gid=20002,mode=0700,noexec,nosuid,nodev
      - /work/slot-20003:size=256m,nr_inodes=4096,uid=20003,gid=20003,mode=0700,noexec,nosuid,nodev
      # Not writable by a run: a shared /tmp would carry one run's data to the next.
      - /tmp:size=16m,mode=0755
    volumes:
      - hermes-sandbox-sock:/run/hermes-sandbox
