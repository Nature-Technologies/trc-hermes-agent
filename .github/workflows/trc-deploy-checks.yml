name: TRC deploy checks

# Additive and TRC-only. Validates deploy/trc/ with no server contact and no
# secrets, so it is safe to run on any branch and on pull requests.

on:
  push:
    branches: [chore/new-ci]
    paths:
      - 'deploy/trc/**'
      - '.github/workflows/trc-*.yml'
  pull_request:
    paths:
      - 'deploy/trc/**'
      - '.github/workflows/trc-*.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: trc-deploy-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate TRC staging deploy assets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.0.0
        with:
          python-version: '3.12'

      - name: Install PyYAML
        run: pip install 'pyyaml==6.0.3'

      # ubuntu-latest ships the docker CLI and compose plugin, which the
      # validator needs for `docker compose config`.
      - name: Run contract checks
        run: python deploy/trc/validate_compose.py
