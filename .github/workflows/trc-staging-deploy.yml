name: TRC staging deploy (hermes-agent)
run-name: Deploy hermes-agent to Dev/Test Server

# Builds AND deploys in one run.
#
# The BUILD RUNS ON THE DEPLOY HOST, via the job-level DOCKER_HOST below --
# same arrangement as trc-backend's deploy. buildx's default container driver
# starts with an empty cache every dispatch, which made every deploy a cold
# 15-45 min build; the host's daemon holds the only layer cache that persists.
# Only the source context crosses the network, never an image.
#
# There is no registry: `push: false` puts the image straight into the deploy
# host's image store, which is the daemon `docker compose up -d` talks to. The
# compose service sets `pull_policy: never` so a missing image fails closed
# instead of silently starting a stale tag left in GHCR by the old scheme.
#
# ROLLBACK IS HOST-LOCAL. `:git-<7-char-sha>` tags exist only in that host's
# image store -- a `docker image prune -a` or a host rebuild destroys every
# rollback target. See docs/deploy/trc-staging.md before pruning there.
#
# Never `docker context create`/`use` here: this runner is shared with sibling
# repos (trc-open-webui, paperclip) and `use` would repoint the default daemon
# for their jobs too. The job-level DOCKER_HOST is scoped to this job.
#
# Other consequences worth knowing:
#   - no env file is written anywhere. The Deploy step binds the secrets as its
#     own `env:`, and Compose resolves the compose file's ${...} references from
#     that process environment -- so no secret touches disk on the runner or the
#     server, and nothing is dotenv-parsed, which means a `$`, backtick or `#`
#     in a value is taken literally instead of interpolated or truncated
#   - bind-mount sources resolve on the REMOTE daemon, so every bind path must
#     be absolute and must already exist on the server

on:
  workflow_dispatch:
    inputs:
      bootstrap:
        description: >-
          Create trc-shared and trc-staging-hermes-memory instead of failing
          when they are missing, and log loudly that it did. Use only when
          standing up a fresh host; leave false on every routine deploy.
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: deploy-staging
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/nature-technologies/trc-hermes-agent
  COMPOSE_FILE_PATH: deploy/trc/docker-compose-staging-trc.yml
  HOST_DIR: /srv/trc/staging/hermes-agent

jobs:
  deploy:
    name: Build and deploy hermes-agent to staging
    if: github.repository == 'Nature-Technologies/trc-hermes-agent'
    runs-on: self-hosted
    environment: staging
    timeout-minutes: 45
    env:
      # Job-wide on purpose: the BUILD runs on the deploy server, not just the
      # deploy. Every docker command below therefore talks to that daemon over
      # SSH -- which is why the SSH key step must come first.
      DOCKER_HOST: ssh://${{ secrets.USERNAME }}@${{ secrets.HOST }}:${{ secrets.SSH_PORT || '22' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Write SSH key and scan the host key
        env:
          SSH_PRIVATE_KEY_DEV: ${{ secrets.SSH_PRIVATE_KEY_DEV }}
          HOST: ${{ secrets.HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
        run: |
          set -eu
          # Never `set -x` in any step here: it would print secrets into the log.
          [ -n "$SSH_PRIVATE_KEY_DEV" ] || { echo "::error::SSH_PRIVATE_KEY_DEV is empty"; exit 1; }
          [ -n "$HOST" ] || { echo "::error::HOST is empty"; exit 1; }

          # The key lives ONLY under $RUNNER_TEMP, never ~/.ssh/id_rsa: this
          # runner is shared with sibling deploys, and one job's cleanup must
          # not delete a key another job is mid-deploy with. The agent socket
          # goes into $GITHUB_ENV so later steps -- including the ssh the
          # Docker CLI spawns for DOCKER_HOST -- inherit it.
          install -m 600 -D /dev/null "$RUNNER_TEMP/id_rsa"
          printf '%s\n' "$SSH_PRIVATE_KEY_DEV" > "$RUNNER_TEMP/id_rsa"
          eval "$(ssh-agent -a "$RUNNER_TEMP/ssh-agent.sock")" >/dev/null
          ssh-add "$RUNNER_TEMP/id_rsa" >/dev/null
          {
            echo "SSH_AUTH_SOCK=$RUNNER_TEMP/ssh-agent.sock"
            echo "SSH_AGENT_PID=$SSH_AGENT_PID"
          } >> "$GITHUB_ENV"

          # Trust-on-first-use; StrictHostKeyChecking stays on, so a key that
          # changes mid-run still aborts. keyscan exits 0 even when nothing
          # answered, so the `test -s` is the real reachability check.
          ssh-keyscan -T 10 -p "$SSH_PORT" -H "$HOST" > "$RUNNER_TEMP/known_hosts"
          test -s "$RUNNER_TEMP/known_hosts"
          install -m 700 -d ~/.ssh
          touch ~/.ssh/known_hosts
          # Drop stale entries for both spellings (keyscan writes a bare host
          # for port 22, `[host]:port` otherwise), then append. Never truncate.
          ssh-keygen -R "$HOST" -f ~/.ssh/known_hosts >/dev/null 2>&1 || true
          ssh-keygen -R "[${HOST}]:${SSH_PORT}" -f ~/.ssh/known_hosts >/dev/null 2>&1 || true
          cat "$RUNNER_TEMP/known_hosts" >> ~/.ssh/known_hosts

      - name: Compute image tags
        id: tags
        run: |
          set -eu
          printf 'staging=%s:staging\n' "$IMAGE" >> "$GITHUB_OUTPUT"
          printf 'sha=%s:git-%s\n' "$IMAGE" "${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      # Runs BEFORE the build: the build happens on this host, so free disk and
      # a reachable daemon are preconditions of the build itself. A full disk
      # must fail in seconds, not 28 minutes in.
      - name: Verify host preconditions
        env:
          BOOTSTRAP: ${{ inputs.bootstrap }}
          HOST: ${{ secrets.HOST }}
          USERNAME: ${{ secrets.USERNAME }}
          SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
        run: |
          set -eu
          case "$BOOTSTRAP" in
            true|false) ;;
            *) echo "::error::bootstrap must be true or false, got '$BOOTSTRAP'"; exit 1 ;;
          esac

          # Proves the SSH transport and the remote daemon before anything else.
          docker version --format 'remote daemon {{.Server.Version}}'

          # BuildKit's out-of-space failures name everything except the cause.
          # Thresholds match trc-backend's deploy.
          avail=$(ssh -o BatchMode=yes -i "$RUNNER_TEMP/id_rsa" -p "$SSH_PORT" \
            "${USERNAME}@${HOST}" \
            'df --output=avail -B1 /var/lib/docker 2>/dev/null | tail -1') || avail=""
          case "$avail" in
            ''|*[!0-9]*)
              echo "::warning::Could not read free space on the deploy host - check df -h manually." ;;
            *)
              gb=$((avail / 1000000000))
              if [ "$avail" -lt 10000000000 ]; then
                echo "::error::Only ${gb} GB free on the deploy host. A cold build needs more than that and fails obscurely when it runs out. See docs/deploy/trc-staging.md for what is safe to prune - note that pruning images also destroys rollback targets."
                exit 1
              elif [ "$avail" -lt 25000000000 ]; then
                echo "::warning::${gb} GB free on the deploy host - enough for a cached build, tight for a cold one."
              else
                echo "OK - ${gb} GB free on the deploy host."
              fi ;;
          esac

          # Fail closed on the external volume unless bootstrapping: creating it
          # on a routine deploy would boot Hermes against a silently EMPTY
          # volume -- no sessions, no memories, no cron -- with every smoke test
          # below still passing.
          if docker volume inspect trc-staging-hermes-memory >/dev/null 2>&1; then
            :
          elif [ "$BOOTSTRAP" = "true" ]; then
            echo "::warning::bootstrap=true -- creating trc-staging-hermes-memory. It will be EMPTY. Only intended for standing up a fresh host."
            docker volume create trc-staging-hermes-memory
          else
            echo "::error::external volume trc-staging-hermes-memory does not exist on the host. This deploy will not create it silently -- create and populate it (see docs/deploy/trc-staging.md), or re-dispatch with bootstrap: true on a genuinely fresh host."
            exit 1
          fi

          # trc-shared belongs to the trc-backend stack; never created here
          # except when bootstrapping. `|| true` because a concurrent bootstrap
          # from a sibling repo can win the race, and "already exists" is the
          # desired end state anyway.
          if docker network inspect trc-shared >/dev/null 2>&1; then
            :
          elif [ "$BOOTSTRAP" = "true" ]; then
            echo "::warning::bootstrap=true -- creating trc-shared on this host."
            docker network create trc-shared || true
          else
            echo "::error::external network trc-shared does not exist on the host. It is owned by the trc-backend stack -- re-dispatch with bootstrap: true only on a genuinely fresh host."
            exit 1
          fi

          # poc-net carries no data, so creating it is always safe.
          docker network create poc-net 2>/dev/null || true

      - name: Set up Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
        with:
          # The remote daemon's own builder, reached through DOCKER_HOST. The
          # default container driver would start empty on every dispatch, which
          # is the failure this whole arrangement exists to avoid.
          driver: docker

      - name: Build the image on the deploy server
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f # v7.1.0
        with:
          context: .
          file: Dockerfile
          # No registry: built straight into the deploy host's image store.
          push: false
          tags: |
            ${{ steps.tags.outputs.staging }}
            ${{ steps.tags.outputs.sha }}
          build-args: |
            HERMES_GIT_SHA=${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
          # No `platforms`: build native to the server, or buildx silently
          # switches on QEMU emulation. No cache-from/to: the daemon's own
          # layer store is the cache now. No attestations: they force a
          # manifest list and an extra export pass for nothing.
          provenance: false

      - name: Copy Hermes config to the host
        env:
          HOST: ${{ secrets.HOST }}
          USERNAME: ${{ secrets.USERNAME }}
          SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
        run: |
          set -eu
          # Bind sources resolve on the REMOTE daemon, so this file genuinely
          # has to be on the server -- unlike the secrets, which the Deploy step
          # passes as process environment. It carries no secret itself.
          ssh -i "$RUNNER_TEMP/id_rsa" -p "$SSH_PORT" "${USERNAME}@${HOST}" \
            "mkdir -p ${HOST_DIR} /srv/trc/staging/fingerprints"

          # Upload BESIDE the target and rename over it -- never scp straight
          # onto it. The container boots as root and docker/stage2-hook.sh
          # chowns $HERMES_HOME/config.yaml to hermes:hermes (UID 10000) mode
          # 640; that path is THIS file, bind-mounted, so the chown lands on
          # the host inode. From the first deploy onward the SSH user can no
          # longer open it for writing and a plain scp dies with
          # "dest open: Permission denied" -- every run, permanently.
          #
          # rename(2) needs write on the DIRECTORY, which the deploy user owns,
          # so it succeeds whatever the old file's owner is, and it leaves the
          # previous config in place if the upload fails.
          #
          # It does replace the inode, so a container that is NOT recreated
          # keeps reading the old file. Routine deploys are safe -- HERMES_IMAGE
          # carries this run's :git-<sha>, so Compose always recreates. A
          # re-dispatch of an ALREADY-deployed sha that only changes config.yaml
          # will not; force it with `docker compose up -d --force-recreate`.
          scp -i "$RUNNER_TEMP/id_rsa" -P "$SSH_PORT" \
            deploy/trc/config.yaml \
            "${USERNAME}@${HOST}:${HOST_DIR}/config.yaml.new"
          ssh -i "$RUNNER_TEMP/id_rsa" -p "$SSH_PORT" "${USERNAME}@${HOST}" \
            "mv -f ${HOST_DIR}/config.yaml.new ${HOST_DIR}/config.yaml"

      - name: Publish the shared-key fingerprint
        env:
          HERMES_API_KEY: ${{ secrets.HERMES_API_KEY }}
          HOST: ${{ secrets.HOST }}
          USERNAME: ${{ secrets.USERNAME }}
          SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
        run: |
          set -eu
          # Twelve hex chars of a SHA-256 over the gateway key. Not a secret;
          # it lets the paperclip deploy detect that its copy has drifted.
          printf '%s' "$HERMES_API_KEY" | sha256sum | cut -c1-12 > hermes.fpr
          scp -i "$RUNNER_TEMP/id_rsa" -P "$SSH_PORT" hermes.fpr \
            "${USERNAME}@${HOST}:/srv/trc/staging/fingerprints/hermes-api-key"

      - name: Deploy
        # Compose resolves the compose file's ${...} references from THIS
        # process environment. No env file is written, on the runner or the
        # server, so no secret ever touches disk -- and because nothing is
        # parsed as dotenv, values are taken literally: a `$`, backtick or `#`
        # in a password survives instead of being interpolated or truncated.
        env:
          # The immutable tag this run built, not the moving `:staging`
          # pointer. To roll back, hardcode an older `:git-<7>` tag here on a
          # throwaway branch -- but only one still in the host's image store.
          HERMES_IMAGE: ${{ steps.tags.outputs.sha }}
          HERMES_BIND: 127.0.0.1
          # Absolute path on the SERVER: the bind source is resolved by the
          # remote daemon. "Copy Hermes config to the host" put it there.
          HERMES_CONFIG_PATH: ${{ env.HOST_DIR }}/config.yaml
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          HERMES_API_KEY: ${{ secrets.HERMES_API_KEY }}
          HERMES_DASHBOARD_BASIC_AUTH_USERNAME: ${{ secrets.HERMES_DASHBOARD_BASIC_AUTH_USERNAME }}
          HERMES_DASHBOARD_BASIC_AUTH_PASSWORD: ${{ secrets.HERMES_DASHBOARD_BASIC_AUTH_PASSWORD }}
        run: |
          set -eu
          echo "deploying $HERMES_IMAGE"
          # No `pull`: the build already put the image in this daemon's store.
          # No `--env-file`: see the note above.
          docker compose -f "$COMPOSE_FILE_PATH" up -d --remove-orphans
          # Best-effort record of what landed. "(no digest)" is expected now --
          # RepoDigests is only set for images that went through a registry.
          if img="$(docker inspect --format '{{.Image}}' hermes-agent 2>/dev/null)"; then
            echo "deployed image id: $img"
          else
            echo "could not inspect hermes-agent for a record (non-fatal)"
          fi

      - name: Smoke test
        run: |
          set -eu
          ok=0
          for _ in $(seq 1 30); do
            if docker exec -i hermes-agent python3 - <<'PY'
          import os, sys, urllib.error, urllib.request
          req = urllib.request.Request(
              "http://127.0.0.1:8642/v1/models",
              headers={"Authorization": "Bearer " + os.environ["API_SERVER_KEY"]},
          )
          try:
              urllib.request.urlopen(req, timeout=10)
          except Exception as exc:
              print(f"gateway not ready: {exc}")
              sys.exit(1)
          print("gateway OK")
          PY
            then ok=1; break; fi
            sleep 2
          done
          if [ "$ok" -ne 1 ]; then
            echo "::error::gateway never answered on :8642 with the deployed key"
            docker logs --tail 50 hermes-agent || true
            exit 1
          fi

          # trc-shared reachability. Assert the REQUEST SUCCEEDS, not that it
          # returns 200 -- an MCP endpoint may answer a bare GET with 405/406.
          docker exec -i hermes-agent python3 - <<'PY'
          import sys, urllib.error, urllib.request
          try:
              urllib.request.urlopen("http://app:8000/mcp", timeout=10)
              print("reached app:8000/mcp over trc-shared")
          except urllib.error.HTTPError as exc:
              print(f"reached app:8000/mcp over trc-shared (HTTP {exc.code})")
          except Exception as exc:
              print(f"could NOT reach app:8000/mcp over trc-shared: {exc}")
              sys.exit(1)
          PY