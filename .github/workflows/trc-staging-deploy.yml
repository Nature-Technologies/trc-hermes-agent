name: TRC staging deploy (hermes-agent)
run-name: Deploy hermes-agent to Dev/Test Server

# Additive and TRC-only. Does NOT build: trc-publish.yml publishes the image and
# this rolls the configured moving tag onto the staging host.
#
# Runs `docker compose` from the runner against the host's Docker daemon over an
# SSH context. Two consequences worth knowing:
#   - the rendered .env is read by the LOCAL compose CLI and never lands on the
#     server; values reach the containers as environment, not as a file on disk
#   - bind-mount sources are resolved by the REMOTE daemon, so every bind path
#     must be absolute and must already exist on the server

on:
  workflow_dispatch:

permissions:
  contents: read
  # Lets the runner authenticate to GHCR itself (see the "Log in to GHCR"
  # step) -- packages are public today, but this makes a private package work
  # too, with no new secret.
  packages: read

concurrency:
  group: trc-staging-deploy
  cancel-in-progress: false

env:
  # The moving tag this deploy tracks, published by trc-publish.yml. Change this
  # one line to follow a different branch tag.
  IMAGE_TAG: dev
  IMAGE_REPO: ghcr.io/nature-technologies/trc-hermes-agent
  COMPOSE_FILE_PATH: deploy/trc/docker-compose-staging-trc.yml
  HOST_DIR: /srv/trc/staging/hermes-agent

jobs:
  deploy:
    name: Deploy hermes-agent to staging
    if: github.repository == 'Nature-Technologies/trc-hermes-agent'
    runs-on: ubuntu-latest
    environment: Staging
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Write SSH key and scan the host key
        env:
          SSH_PRIVATE_KEY_DEV: ${{ secrets.SSH_PRIVATE_KEY_DEV }}
          HOST: ${{ secrets.HOST }}
          SSH_PORT: ${{ secrets.TRC_SSH_PORT || '22' }}
        run: |
          set -eu
          # Never `set -x` in any step here: it would print secrets into the log.
          if [ -z "$SSH_PRIVATE_KEY_DEV" ]; then
            echo "::error::SSH_PRIVATE_KEY_DEV is empty"; exit 1
          fi
          if [ -z "$HOST" ]; then
            echo "::error::HOST is empty"; exit 1
          fi
          install -m 600 -D /dev/null ~/.ssh/id_rsa
          printf '%s\n' "$SSH_PRIVATE_KEY_DEV" > ~/.ssh/id_rsa
          # Trust-on-first-use: the host key is taken from the host at deploy
          # time rather than pinned. StrictHostKeyChecking stays ON, so a key
          # that changes mid-run still aborts.
          ssh-keyscan -p "$SSH_PORT" -H "$HOST" > ~/.ssh/known_hosts 2>/dev/null
          if [ ! -s ~/.ssh/known_hosts ]; then
            echo "::error::ssh-keyscan returned nothing for $HOST — host unreachable or SSH closed"
            exit 1
          fi

      - name: Set up the remote Docker context
        env:
          HOST: ${{ secrets.HOST }}
          USERNAME: ${{ secrets.USERNAME }}
          SSH_PORT: ${{ secrets.TRC_SSH_PORT || '22' }}
        run: |
          set -eu
          # SSH_PORT here must match the port ssh-keyscan used above, or
          # known_hosts describes a different endpoint than the one this
          # context actually dials.
          docker context create trc-staging \
            --docker "host=ssh://${USERNAME}@${HOST}:${SSH_PORT}"
          docker context use trc-staging
          # Proves the SSH transport and the remote daemon before anything else.
          docker version --format 'remote daemon {{.Server.Version}}'

      - name: Verify host preconditions
        run: |
          set -eu
          # Fail closed on the external volume. Compose refuses to start when an
          # external volume is missing, and that is the guard: creating it here
          # would boot Hermes against a silently EMPTY volume -- no sessions, no
          # memories, no cron -- and every smoke test below would still pass.
          # It is created and populated during the Phase 2 migration.
          if ! docker volume inspect trc-staging-hermes-memory >/dev/null 2>&1; then
            echo "::error::external volume trc-staging-hermes-memory does not exist on the host. Create and populate it during the Phase 2 migration; this deploy will not create it."
            exit 1
          fi
          # trc-shared belongs to the trc-backend stack; this deploy never
          # creates it.
          if ! docker network inspect trc-shared >/dev/null 2>&1; then
            echo "::error::external network trc-shared does not exist on the host. It is owned by the trc-backend stack."
            exit 1
          fi
          # poc-net carries no data, so creating it is safe and idempotent.
          docker network create poc-net 2>/dev/null || true

      - name: Copy Hermes config to the host
        env:
          HOST: ${{ secrets.HOST }}
          USERNAME: ${{ secrets.USERNAME }}
          SSH_PORT: ${{ secrets.TRC_SSH_PORT || '22' }}
        run: |
          set -eu
          # config.yaml is a bind mount, and bind sources are resolved by the
          # REMOTE daemon -- so unlike the .env, this file genuinely has to be
          # on the server. It carries no secret (model, dashboard and MCP URL
          # config only).
          ssh -i ~/.ssh/id_rsa -p "$SSH_PORT" "${USERNAME}@${HOST}" \
            "mkdir -p ${HOST_DIR}"
          scp -i ~/.ssh/id_rsa -P "$SSH_PORT" \
            deploy/trc/config.yaml \
            "${USERNAME}@${HOST}:${HOST_DIR}/config.yaml"

      - name: Render the environment file
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          HERMES_API_KEY: ${{ secrets.HERMES_API_KEY }}
          DASH_USER: ${{ secrets.HERMES_DASHBOARD_BASIC_AUTH_USERNAME }}
          DASH_PASS: ${{ secrets.HERMES_DASHBOARD_BASIC_AUTH_PASSWORD }}
        run: |
          set -eu
          # This file stays on the runner. The local compose CLI reads it and
          # sends the values to the remote daemon as container environment, so
          # no plaintext secret is ever written to the staging host.

          if [ "${#HERMES_API_KEY}" -lt 16 ]; then
            echo "::error::HERMES_API_KEY must be at least 16 characters. Below that the gateway refuses to start the API server at all, so the symptom is connection-refused on :8642, not a 401."
            exit 1
          fi
          for name in OPENROUTER_API_KEY HERMES_API_KEY DASH_USER DASH_PASS; do
            eval "value=\${$name}"
            case "$value" in
              *'$'*|*'`'*|*'#'*)
                echo "::error::$name contains \$, a backtick or #, which Compose mangles when interpolating the env file"
                exit 1 ;;
            esac
          done

          umask 077
          {
            printf 'HERMES_IMAGE=%s:%s\n' "$IMAGE_REPO" "$IMAGE_TAG"
            printf 'OPENROUTER_API_KEY=%s\n' "$OPENROUTER_API_KEY"
            printf 'HERMES_API_KEY=%s\n' "$HERMES_API_KEY"
            printf 'HERMES_DASHBOARD_BASIC_AUTH_USERNAME=%s\n' "$DASH_USER"
            printf 'HERMES_DASHBOARD_BASIC_AUTH_PASSWORD=%s\n' "$DASH_PASS"
            printf 'HERMES_BIND=127.0.0.1\n'
            printf 'HERMES_CONFIG_PATH=%s/config.yaml\n' "$HOST_DIR"
          } > .env.staging

      - name: Publish the shared-key fingerprint
        env:
          HERMES_API_KEY: ${{ secrets.HERMES_API_KEY }}
          HOST: ${{ secrets.HOST }}
          USERNAME: ${{ secrets.USERNAME }}
          SSH_PORT: ${{ secrets.TRC_SSH_PORT || '22' }}
        run: |
          set -eu
          # Twelve hex characters of a SHA-256 over the gateway key. Not a
          # secret and not brute-forceable; it lets the paperclip deploy detect
          # that its third copy of HERMES_API_KEY has drifted.
          printf '%s' "$HERMES_API_KEY" | sha256sum | cut -c1-12 > hermes.fpr
          ssh -i ~/.ssh/id_rsa -p "$SSH_PORT" "${USERNAME}@${HOST}" \
            'mkdir -p /srv/trc/staging/fingerprints'
          scp -i ~/.ssh/id_rsa -P "$SSH_PORT" hermes.fpr \
            "${USERNAME}@${HOST}:/srv/trc/staging/fingerprints/hermes-api-key"
          rm -f hermes.fpr

      - name: Log in to GHCR
        # Over a remote Docker context, `docker compose pull` sends THIS
        # runner's registry credentials to the remote daemon (X-Registry-Auth)
        # -- the staging host never needs, and never gets, any credential of
        # its own. Logging in here, not on the host, is what replaces the old
        # host-side `docker login` + GHCR_READ_TOKEN secret; it works whether
        # the package is public or private.
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull and deploy
        run: |
          set -eu
          echo "deploying ${IMAGE_REPO}:${IMAGE_TAG}"
          docker compose --env-file .env.staging -f "$COMPOSE_FILE_PATH" pull
          docker compose --env-file .env.staging -f "$COMPOSE_FILE_PATH" up -d --remove-orphans
          # Record what actually landed, so a rollback has a named target. Read
          # from the IMAGE, not the container: a container's inspect output has
          # no RepoDigests key at all. Guarded: a digest record is best-effort
          # and must never fail an otherwise-successful deploy.
          if img="$(docker inspect --format '{{.Image}}' hermes-agent 2>/dev/null)"; then
            echo "deployed digest:"
            docker image inspect "$img" \
              --format '{{if .RepoDigests}}{{index .RepoDigests 0}}{{else}}(no digest){{end}}'
          else
            echo "could not inspect hermes-agent for a digest record (non-fatal)"
          fi

      - name: Smoke test
        run: |
          set -eu
          ok=0
          for _ in $(seq 1 30); do
            if docker exec -i hermes-agent python3 - <<'PY'
          import os, sys, urllib.error, urllib.request
          req = urllib.request.Request(
              "http://127.0.0.1:8642/v1/models",
              headers={"Authorization": "Bearer " + os.environ["API_SERVER_KEY"]},
          )
          try:
              urllib.request.urlopen(req, timeout=10)
          except Exception as exc:
              print(f"gateway not ready: {exc}")
              sys.exit(1)
          print("gateway OK")
          PY
            then ok=1; break; fi
            sleep 2
          done
          if [ "$ok" -ne 1 ]; then
            echo "::error::gateway never answered on :8642 with the deployed key"
            docker logs --tail 50 hermes-agent || true
            exit 1
          fi

          # trc-shared reachability. Assert the REQUEST SUCCEEDS, not that it
          # returns 200 -- an MCP endpoint may answer a bare GET with 405/406.
          # What is under test is DNS plus routing to the backend.
          docker exec -i hermes-agent python3 - <<'PY'
          import sys, urllib.error, urllib.request
          try:
              urllib.request.urlopen("http://app:8000/mcp", timeout=10)
              print("reached app:8000/mcp over trc-shared")
          except urllib.error.HTTPError as exc:
              print(f"reached app:8000/mcp over trc-shared (HTTP {exc.code})")
          except Exception as exc:
              print(f"could NOT reach app:8000/mcp over trc-shared: {exc}")
              sys.exit(1)
          PY

      - name: Remove the deploy context
        if: always()
        run: |
          set -eu
          # .env.staging is the only secret this workflow ever writes to disk
          # on the runner (never on the host). Clean it up even on failure.
          rm -f .env.staging
          docker context use default || true
          docker context rm trc-staging || true
