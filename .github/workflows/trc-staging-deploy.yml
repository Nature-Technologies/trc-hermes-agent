name: TRC staging deploy (hermes-agent)
run-name: Deploy hermes-agent to Dev/Test Server

# Additive and TRC-only. Builds AND deploys in one run -- trc-publish.yml is
# gone, so the tag this deploy pulls always exists by the time it pulls it.
#
# Runs on a SELF-HOSTED runner: the staging host is internal and unreachable
# from a GitHub-hosted runner. The image is built locally on the runner (no
# DOCKER_HOST in that step's env), pushed to GHCR, and only THEN does
# `docker compose` talk to the staging host's daemon, over
# `DOCKER_HOST=ssh://...` set as env: on the individual steps that need it.
#
# Never `docker context create`/`use` here. A context is persistent state on
# a self-hosted runner: `create` fails "already exists" on the second run,
# `use` repoints the runner's DEFAULT daemon for every later job on this
# machine, and buildx binds to whichever daemon is current -- so an active
# context would silently build the image on the deploy host instead of the
# runner. Step-scoped DOCKER_HOST cannot leak into the build step that way.
#
# Consequences worth knowing:
#   - the rendered .env.staging is read by the LOCAL compose CLI and never
#     lands on the server; values reach the containers as environment, not
#     as a file on disk
#   - bind-mount sources are resolved by the REMOTE daemon, so every bind
#     path must be absolute and must already exist on the server
#   - this runner is PERSISTENT and SHARED with sibling repos' deploys
#     (trc-open-webui, paperclip), which can run concurrently on the same
#     $HOME. THREE files in that $HOME would otherwise be shared; two of
#     them are isolated structurally here:
#       * the private key -- loaded into a per-job ssh-agent from a file
#         under $RUNNER_TEMP, never ~/.ssh/id_rsa, so one job's cleanup can
#         never delete the key a sibling job is mid-deploy with
#       * ~/.docker/config.json -- the job-level DOCKER_CONFIG below points
#         every docker/compose/buildx call at a per-job directory instead.
#         Without it, this job's cleanup `docker logout ghcr.io` would strip
#         the GHCR credential out from under a sibling repo's concurrent
#         `docker compose pull`, and buildx state would be shared too
#       * ~/.ssh/known_hosts -- still genuinely shared (see
#         docs/deploy/trc-staging.md). Left shared deliberately: the merge
#         below is non-destructive so the worst case is a redundant rescan,
#         and it is handled by documenting a one-job-at-a-time /
#         separate-users requirement rather than structurally
#     Every secret this workflow writes to disk (the key, .env.staging, the
#     fingerprint temp file, the per-job docker config) is removed and the
#     agent killed in the final cleanup step, which runs even when an
#     earlier step fails.
#   - the deploy pulls the IMMUTABLE `:git-<7-char-sha>` tag this run built,
#     not the moving `:staging` pointer -- see the "Render the environment
#     file" step

on:
  workflow_dispatch:
    inputs:
      bootstrap:
        description: >-
          Create trc-shared and trc-staging-hermes-memory instead of failing
          when they are missing, and log loudly that it did. Use only when
          standing up a fresh host; leave false on every routine deploy.
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-staging
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/nature-technologies/trc-hermes-agent
  COMPOSE_FILE_PATH: deploy/trc/docker-compose-staging-trc.yml
  HOST_DIR: /srv/trc/staging/hermes-agent

jobs:
  deploy:
    name: Build and deploy hermes-agent to staging
    if: github.repository == 'Nature-Technologies/trc-hermes-agent'
    # Labelled, not bare `self-hosted`, so a non-Linux runner registered
    # later on this label set cannot pick up a job that needs docker/buildx
    # and an OpenSSH client.
    runs-on: [self-hosted, linux]
    environment: staging
    timeout-minutes: 45
    # Per-job Docker config directory, so nothing this job does to the GHCR
    # credential can reach a sibling repo's concurrent deploy on the same
    # $HOME -- and vice versa. docker, docker compose, docker buildx and
    # docker/login-action all honour DOCKER_CONFIG, so this one variable
    # isolates both the credential store and buildx's own state.
    #
    # Job level is correct and is NOT the hazard a job-level DOCKER_HOST
    # would be: DOCKER_CONFIG only says WHERE credentials live, never WHICH
    # daemon to talk to, so it cannot redirect the build step off the runner.
    #
    # The path is built from `github.workspace` rather than the more obvious
    # `runner.temp`, because the `runner` context is NOT available in
    # `jobs.<job_id>.env` -- GitHub rejects the whole workflow with
    # "Unrecognized named-value: 'runner'". `github.workspace` is available
    # there, and its PARENT is used on purpose: the directory must stay
    # OUTSIDE the `context: .` build context, or buildx would upload the GHCR
    # credential into the image build.
    env:
      DOCKER_CONFIG: ${{ github.workspace }}/../.trc-docker-config-${{ github.run_id }}
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Create the per-job Docker config directory
        run: |
          set -eu
          # Must exist before `docker login` writes into it. 700 because it is
          # about to hold a registry credential.
          install -m 700 -d "$DOCKER_CONFIG"
          echo "DOCKER_CONFIG=$DOCKER_CONFIG"

      - name: Write SSH key and scan the host key
        env:
          SSH_PRIVATE_KEY_DEV: ${{ secrets.SSH_PRIVATE_KEY_DEV }}
          HOST: ${{ secrets.HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
        run: |
          set -eu
          # Never `set -x` in any step here: it would print secrets into the log.
          if [ -z "$SSH_PRIVATE_KEY_DEV" ]; then
            echo "::error::SSH_PRIVATE_KEY_DEV is empty"; exit 1
          fi
          if [ -z "$HOST" ]; then
            echo "::error::HOST is empty"; exit 1
          fi

          # The key lives ONLY under $RUNNER_TEMP -- never ~/.ssh/id_rsa --
          # and is loaded into a per-job ssh-agent. This runner is
          # PERSISTENT and shared with sibling repos' deploys, which can run
          # concurrently on the same $HOME: a shared ~/.ssh/id_rsa would let
          # one job's cleanup delete the key a sibling job is mid-deploy
          # with. The agent's socket is exported via $GITHUB_ENV so every
          # later step in THIS job inherits it, which authenticates both the
          # explicit ssh/scp calls below (passed -i explicitly too, since
          # that costs nothing and does not depend on default-identity
          # resolution) and the ssh the Docker CLI spawns internally for
          # DOCKER_HOST.
          install -m 600 -D /dev/null "$RUNNER_TEMP/id_rsa"
          printf '%s\n' "$SSH_PRIVATE_KEY_DEV" > "$RUNNER_TEMP/id_rsa"
          eval "$(ssh-agent -a "$RUNNER_TEMP/ssh-agent.sock")" >/dev/null
          ssh-add "$RUNNER_TEMP/id_rsa" >/dev/null
          {
            echo "SSH_AUTH_SOCK=$RUNNER_TEMP/ssh-agent.sock"
            echo "SSH_AGENT_PID=$SSH_AGENT_PID"
          } >> "$GITHUB_ENV"

          # known_hosts is still genuinely SHARED across sibling jobs on
          # this runner -- see docs/deploy/trc-staging.md, which documents
          # that the runner must process one job at a time, and that
          # multiple runners on one machine must run as separate users. The
          # scan-then-append below is non-destructive, so the residual race
          # here is low-risk (worst case: a redundant rescan), unlike the
          # id_rsa collision above, which is a hard failure.
          #
          # Trust-on-first-use: the host key is taken from the host at
          # deploy time rather than pinned. StrictHostKeyChecking stays ON,
          # so a key that changes mid-run still aborts.
          ssh-keyscan -T 10 -p "$SSH_PORT" -H "$HOST" > "$RUNNER_TEMP/known_hosts"
          # ssh-keyscan exits 0 even when nothing answered -- this is the
          # actual reachability check, and it must fail now, not 45 minutes
          # into the build.
          test -s "$RUNNER_TEMP/known_hosts"
          install -m 700 -d ~/.ssh
          touch ~/.ssh/known_hosts
          # Remove any stale entry for this host, both spellings -- keyscan
          # writes a bare host for port 22 and `[host]:port` otherwise -- then
          # append the fresh scan. Never truncate with `>` or `tee`.
          ssh-keygen -R "$HOST" -f ~/.ssh/known_hosts >/dev/null 2>&1 || true
          ssh-keygen -R "[${HOST}]:${SSH_PORT}" -f ~/.ssh/known_hosts >/dev/null 2>&1 || true
          cat "$RUNNER_TEMP/known_hosts" >> ~/.ssh/known_hosts

      - name: Log in to GHCR
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image tags
        id: tags
        run: |
          set -eu
          printf 'staging=%s:staging\n' "$IMAGE" >> "$GITHUB_OUTPUT"
          printf 'sha=%s:git-%s\n' "$IMAGE" "${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build and push
        # NO DOCKER_HOST in this step's env -- it must build on the RUNNER,
        # never on the deploy host. See the file header.
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f # v7.1.0
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ steps.tags.outputs.staging }}
            ${{ steps.tags.outputs.sha }}
          build-args: |
            HERMES_GIT_SHA=${{ github.sha }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=min

      - name: Verify host preconditions
        env:
          DOCKER_HOST: ssh://${{ secrets.USERNAME }}@${{ secrets.HOST }}:${{ secrets.SSH_PORT || '22' }}
          BOOTSTRAP: ${{ inputs.bootstrap }}
        run: |
          set -eu
          # A workflow_dispatch boolean renders as exactly `true` or `false`.
          # Read through an env: binding and validated here rather than
          # spliced as `${{ inputs.bootstrap }}` straight into the shell text
          # below: the same form is used in every step of all three repos'
          # deploys, so there is one place to reason about and no expression
          # interpolation inside a test.
          case "$BOOTSTRAP" in
            true|false) ;;
            *)
              echo "::error::bootstrap must be true or false, got '$BOOTSTRAP'"
              exit 1 ;;
          esac

          # Proves the SSH transport and the remote daemon before anything else.
          docker version --format 'remote daemon {{.Server.Version}}'

          # Fail closed on the external volume, UNLESS bootstrapping a fresh
          # host: Compose refuses to start when an external volume is
          # missing, and that is the guard. Creating it on a routine deploy
          # would boot Hermes against a silently EMPTY volume -- no sessions,
          # no memories, no cron -- with every smoke test below still passing.
          if docker volume inspect trc-staging-hermes-memory >/dev/null 2>&1; then
            :
          elif [ "$BOOTSTRAP" = "true" ]; then
            echo "::warning::bootstrap=true -- creating trc-staging-hermes-memory. It will be EMPTY. Only intended for standing up a fresh host."
            docker volume create trc-staging-hermes-memory
          else
            echo "::error::external volume trc-staging-hermes-memory does not exist on the host. This deploy will not create it silently -- create and populate it (see docs/deploy/trc-staging.md), or re-dispatch with bootstrap: true on a genuinely fresh host."
            exit 1
          fi

          # trc-shared belongs to the trc-backend stack; this deploy never
          # creates it, unless bootstrapping a fresh host.
          if docker network inspect trc-shared >/dev/null 2>&1; then
            :
          elif [ "$BOOTSTRAP" = "true" ]; then
            echo "::warning::bootstrap=true -- creating trc-shared on this host."
            # `|| true` for the same reason poc-net's create has it: two
            # bootstrap dispatches (this repo and open-webui) can reach this
            # line concurrently, and the loser of that race would otherwise
            # fail the deploy on an "already exists" that is the desired end
            # state anyway. stderr is deliberately NOT suppressed here, unlike
            # poc-net's create -- a genuine failure on a bootstrap path should
            # still be visible in the log.
            docker network create trc-shared || true
          else
            echo "::error::external network trc-shared does not exist on the host. It is owned by the trc-backend stack -- re-dispatch with bootstrap: true only on a genuinely fresh host."
            exit 1
          fi

          # poc-net carries no data, so creating it is always safe and idempotent.
          docker network create poc-net 2>/dev/null || true

      - name: Copy Hermes config to the host
        env:
          HOST: ${{ secrets.HOST }}
          USERNAME: ${{ secrets.USERNAME }}
          SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
        run: |
          set -eu
          # config.yaml is a bind mount, and bind sources are resolved by the
          # REMOTE daemon -- so unlike .env.staging, this file genuinely has
          # to be on the server. It carries no secret (model, dashboard and
          # MCP URL config only).
          ssh -i "$RUNNER_TEMP/id_rsa" -p "$SSH_PORT" "${USERNAME}@${HOST}" \
            "mkdir -p ${HOST_DIR} /srv/trc/staging/fingerprints"
          scp -i "$RUNNER_TEMP/id_rsa" -P "$SSH_PORT" \
            deploy/trc/config.yaml \
            "${USERNAME}@${HOST}:${HOST_DIR}/config.yaml"

      - name: Render the environment file
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          HERMES_API_KEY: ${{ secrets.HERMES_API_KEY }}
          DASH_USER: ${{ secrets.HERMES_DASHBOARD_BASIC_AUTH_USERNAME }}
          DASH_PASS: ${{ secrets.HERMES_DASHBOARD_BASIC_AUTH_PASSWORD }}
          # The IMMUTABLE tag this run built, not the moving `:staging`
          # pointer -- so the deploy runs exactly what this run built, and
          # "what is running" is unambiguous. `:staging` is still pushed
          # above (Build and push) as a human-readable pointer, but nothing
          # in this workflow ever deploys it. For rollback, edit this one
          # line on a throwaway branch to hardcode an older `:git-<7>` tag
          # instead of this dynamic expression -- see
          # docs/deploy/trc-staging.md.
          DEPLOY_IMAGE: ${{ steps.tags.outputs.sha }}
        run: |
          set -eu
          # This file stays on the runner. The local compose CLI reads it and
          # sends the values to the remote daemon as container environment,
          # so no plaintext secret is ever written to the staging host.

          if [ "${#HERMES_API_KEY}" -lt 16 ]; then
            echo "::error::HERMES_API_KEY must be at least 16 characters. Below that the gateway refuses to start the API server at all, so the symptom is connection-refused on :8642, not a 401."
            exit 1
          fi
          for name in OPENROUTER_API_KEY HERMES_API_KEY DASH_USER DASH_PASS; do
            eval "value=\${$name}"
            case "$value" in
              *'$'*|*'`'*|*'#'*)
                echo "::error::$name contains \$, a backtick or #, which Compose mangles when interpolating the env file"
                exit 1 ;;
            esac
          done

          umask 077
          {
            printf 'HERMES_IMAGE=%s\n' "$DEPLOY_IMAGE"
            printf 'OPENROUTER_API_KEY=%s\n' "$OPENROUTER_API_KEY"
            printf 'HERMES_API_KEY=%s\n' "$HERMES_API_KEY"
            printf 'HERMES_DASHBOARD_BASIC_AUTH_USERNAME=%s\n' "$DASH_USER"
            printf 'HERMES_DASHBOARD_BASIC_AUTH_PASSWORD=%s\n' "$DASH_PASS"
            printf 'HERMES_BIND=127.0.0.1\n'
            printf 'HERMES_CONFIG_PATH=%s/config.yaml\n' "$HOST_DIR"
          } > .env.staging

      - name: Publish the shared-key fingerprint
        env:
          HERMES_API_KEY: ${{ secrets.HERMES_API_KEY }}
          HOST: ${{ secrets.HOST }}
          USERNAME: ${{ secrets.USERNAME }}
          SSH_PORT: ${{ secrets.SSH_PORT || '22' }}
        run: |
          set -eu
          # Twelve hex characters of a SHA-256 over the gateway key. Not a
          # secret and not brute-forceable; it lets the paperclip deploy detect
          # that its third copy of HERMES_API_KEY has drifted.
          printf '%s' "$HERMES_API_KEY" | sha256sum | cut -c1-12 > hermes.fpr
          scp -i "$RUNNER_TEMP/id_rsa" -P "$SSH_PORT" hermes.fpr \
            "${USERNAME}@${HOST}:/srv/trc/staging/fingerprints/hermes-api-key"

      - name: Pull and deploy
        env:
          DOCKER_HOST: ssh://${{ secrets.USERNAME }}@${{ secrets.HOST }}:${{ secrets.SSH_PORT || '22' }}
        run: |
          set -eu
          # Read the tag back from .env.staging rather than recomputing it,
          # so this log line can never drift from what actually gets
          # deployed -- including on a rollback dispatch that hardcoded a
          # different tag in the "Render the environment file" step.
          echo "deploying $(grep '^HERMES_IMAGE=' .env.staging | cut -d= -f2-)"
          docker compose --env-file .env.staging -f "$COMPOSE_FILE_PATH" pull
          docker compose --env-file .env.staging -f "$COMPOSE_FILE_PATH" up -d --remove-orphans
          # Record what actually landed, so a rollback has a named target. Read
          # from the IMAGE, not the container: a container's inspect output has
          # no RepoDigests key at all. Guarded: a digest record is best-effort
          # and must never fail an otherwise-successful deploy.
          if img="$(docker inspect --format '{{.Image}}' hermes-agent 2>/dev/null)"; then
            echo "deployed digest:"
            docker image inspect "$img" \
              --format '{{if .RepoDigests}}{{index .RepoDigests 0}}{{else}}(no digest){{end}}'
          else
            echo "could not inspect hermes-agent for a digest record (non-fatal)"
          fi

      - name: Smoke test
        env:
          DOCKER_HOST: ssh://${{ secrets.USERNAME }}@${{ secrets.HOST }}:${{ secrets.SSH_PORT || '22' }}
        run: |
          set -eu
          ok=0
          for _ in $(seq 1 30); do
            if docker exec -i hermes-agent python3 - <<'PY'
          import os, sys, urllib.error, urllib.request
          req = urllib.request.Request(
              "http://127.0.0.1:8642/v1/models",
              headers={"Authorization": "Bearer " + os.environ["API_SERVER_KEY"]},
          )
          try:
              urllib.request.urlopen(req, timeout=10)
          except Exception as exc:
              print(f"gateway not ready: {exc}")
              sys.exit(1)
          print("gateway OK")
          PY
            then ok=1; break; fi
            sleep 2
          done
          if [ "$ok" -ne 1 ]; then
            echo "::error::gateway never answered on :8642 with the deployed key"
            docker logs --tail 50 hermes-agent || true
            exit 1
          fi

          # trc-shared reachability. Assert the REQUEST SUCCEEDS, not that it
          # returns 200 -- an MCP endpoint may answer a bare GET with 405/406.
          # What is under test is DNS plus routing to the backend.
          docker exec -i hermes-agent python3 - <<'PY'
          import sys, urllib.error, urllib.request
          try:
              urllib.request.urlopen("http://app:8000/mcp", timeout=10)
              print("reached app:8000/mcp over trc-shared")
          except urllib.error.HTTPError as exc:
              print(f"reached app:8000/mcp over trc-shared (HTTP {exc.code})")
          except Exception as exc:
              print(f"could NOT reach app:8000/mcp over trc-shared: {exc}")
              sys.exit(1)
          PY

      - name: Clean up secrets on the runner
        # if: always() -- this runner is PERSISTENT and reused by later jobs,
        # so every secret written to disk above must be removed, and the
        # per-job ssh-agent killed, even when an earlier step failed --
        # including a failure before the agent ever started (ssh-agent -k
        # and the rm's are all best-effort for exactly that reason).
        if: always()
        run: |
          set -eu
          rm -f "$RUNNER_TEMP/id_rsa" .env.staging hermes.fpr
          ssh-agent -k >/dev/null 2>&1 || true
          # Both of these now act ONLY on this job's own DOCKER_CONFIG
          # directory, never on the shared ~/.docker/config.json -- which is
          # exactly why the logout is safe to keep: before DOCKER_CONFIG was
          # isolated, this line stripped the GHCR credential out from under a
          # sibling repo's concurrent `docker compose pull`.
          docker logout ghcr.io || true
          rm -rf "$DOCKER_CONFIG"
